name: Compilation Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compiler
        run: cmake --build build --config Release --target TriforceEditeur te_tests --parallel

      - name: Préparer le paquet
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/TriforceEditeur | Out-Null
          Copy-Item build/Release/TriforceEditeur.exe dist/TriforceEditeur/
          Copy-Item LISEZMOI.md dist/TriforceEditeur/
          Compress-Archive -Path dist/TriforceEditeur/* -DestinationPath dist/TriforceEditeur.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: TriforceEditeur
          path: dist/TriforceEditeur/

      - name: Publier la dernière version
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dernier --yes --cleanup-tag || true
          gh release create dernier dist/TriforceEditeur.zip --prerelease \
            --title "Dernière version (${GITHUB_SHA::7})" \
            --notes "Compilée automatiquement depuis le commit ${GITHUB_SHA::7}. Télécharge TriforceEditeur.zip, décompresse-le et lance TriforceEditeur.exe."
